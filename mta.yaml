_schema-version: 3.3.0
ID: Customer_Order_Management
description: A simple CAP project.
version: 1.0.0
modules:
- name: Customer_Order_Management-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: Customer_Order_Management-db
  - name: Customer_Order_Management-destination
  - name: Customer_Order_Management-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: Customer_Order_Management-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: Customer_Order_Management-db
  parameters:
    buildpack: nodejs_buildpack
- name: Customer_Order_Management
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: Customer_Order_Management-html5-runtime
  - name: Customer_Order_Management-auth
  - name: Customer_Order_Management-destination
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: Customer_Order_Management-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: srv-api
  - name: Customer_Order_Management-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  - name: Customer_Order_Management-auth
  parameters:
    config:
      destinations:
      - Authentication: NoAuthentication
        HTML5.DynamicDestination: true
        HTML5.ForwardAuthToken: true
        Name: srv-api
        ProxyType: Internet
        Type: HTTP
        URL: ~{srv-api/srv-url}
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - finance_dashboard.zip
      name: Customer_Order_Managementfinance_dashboard
      target-path: app/
    - artifacts:
      - invoice_analytics.zip
      name: Customer_Order_Managementinvoice_analytics
      target-path: app/
    - artifacts:
      - sales_portal.zip
      name: Customer_Order_Managementsales_portal
      target-path: app/
    - artifacts:
      - customer.zip
      name: customer
      target-path: app/
    - artifacts:
      - product.zip
      name: product
      target-path: app/
    
- name: Customer_Order_Managementfinance_dashboard
  type: html5
  path: app/finance_dashboard
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: Customer_Order_Managementinvoice_analytics
  type: html5
  path: app/invoice_analytics
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: Customer_Order_Managementsales_portal
  type: html5
  path: app/sales_portal
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: Customer_Order_Management-destinations
  type: com.sap.application.content
  requires:
  - name: Customer_Order_Management-html5-repo-host
    parameters:
      service-key:
        name: Customer_Order_Management-html5-repo-host-key
  - name: srv-api
  - name: Customer_Order_Management-destination
    parameters:
      content-target: true
  - name: Customer_Order_Management-auth
    parameters:
      service-key:
        name: Customer_Order_Management-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: Customer_Order_Management-html5-repository
          ServiceInstanceName: Customer_Order_Management-html5-repo-host
          ServiceKeyName: Customer_Order_Management-html5-repo-host-key
          sap.cloud.service: Customer_Order_Management.service
        - Authentication: OAuth2UserTokenExchange
          Name: Customer_Order_Management-auth
          ServiceInstanceName: Customer_Order_Management-auth
          ServiceKeyName: Customer_Order_Management-auth-key
          sap.cloud.service: Customer_Order_Management.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: customer
  type: html5
  path: app/customer
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: product
  type: html5
  path: app/product
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

resources:
- name: Customer_Order_Management-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: Customer_Order_Management-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: Customer_Order_Management-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: Customer_Order_Management-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: Customer_Order_Management-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
        redirect-uris:
        - https://*~{app-api/app-uri}/**
      role-collections:
      - description: generated
        name: SalesRep (Customer_Order_Management ${org}-${space})
        role-template-references:
        - $XSAPPNAME.SalesRep
      - description: generated
        name: SalesManager (Customer_Order_Management ${org}-${space})
        role-template-references:
        - $XSAPPNAME.SalesManager
      - description: generated
        name: Finance (Customer_Order_Management ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Finance
      - description: generated
        name: Administrator (Customer_Order_Management ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Administrator
      tenant-mode: dedicated
      xsappname: Customer_Order_Management-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
  requires:
  - name: app-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
